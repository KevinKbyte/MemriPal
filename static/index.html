<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MemriPal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#1f3a5f">

  </head>
  <body>
    <main>
      <h1>MemriPal</h1>
      <p id="public-banner" hidden>live needs passcode / try Load demo</p>
      <p id="status">Checking backend...</p>
      <p id="meta-notice" hidden>Your photo is sent to Meta's AI APIs to find places in it.</p>
      <label for="photo">Take or choose a photo of a room</label>
      <input id="photo" type="file" accept="image/*" capture="environment">
      <label for="passcode">Live passcode (not needed for Load demo)</label>
      <input id="passcode" type="password" autocomplete="off">
      <button id="load-demo" type="button">Load demo</button>
      <fieldset id="place-settings">
        <legend>Place history (optional)</legend>
        <label><input id="place-toggle" type="checkbox"> Use my location for place history</label>
        <label for="place-typed">Or type a place</label>
        <input id="place-typed" type="text" maxlength="255" autocomplete="off">
        <div id="places"></div>
      </fieldset>
      <p id="upload-status" role="status"></p>
      <div id="scene-wrap">
        <canvas id="scene" width="0" height="0"></canvas>
      </div>
      <ol id="loci"></ol>
      <p id="assoc-status" role="status"></p>
      <div id="associations"></div>
      <label><input id="auto" type="checkbox"> Auto: skip route review</label>
      <section id="route-review" hidden>
        <h2>Review your route</h2>
        <ol id="route"></ol>
        <button id="route-undo" type="button" hidden>Undo drop</button>
        <button id="generate" type="button">Generate</button>
      </section>
      <div id="scenes"></div>
      <section id="walk" hidden>
        <h2>Walk your palace</h2>
        <div id="walk-step"></div>
        <button id="walk-prev" type="button">Previous</button>
        <button id="walk-next" type="button">Next</button>
      </section>
      <section id="recall" hidden>
        <h2>Recall your palace</h2>
        <button id="recall-start" type="button">Start recall</button>
        <button id="recall-replay" type="button">Play the replay of a recorded session</button>
        <textarea id="recall-typed" rows="4" aria-label="Type what you remember" hidden></textarea>
        <button id="recall-submit" type="button">Done</button>
        <div id="recall-live"></div>
        <div id="recall-results"></div>
      </section>
      <section id="history" hidden>
        <h2>Rehearsals</h2>
        <ol id="rehearsals"></ol>
        <button id="rehearsal-undo" type="button" hidden>Undo delete</button>
        <div id="history-view"></div>
        <h3>Hit rate per point</h3>
        <ul id="hit-rates"></ul>
      </section>
      <div id="scene-overlay" hidden></div>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
