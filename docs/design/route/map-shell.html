<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MemriPal map-first shell (design preview)</title>
    <!-- Design preview only (MEM-072): map-first home per owner direction. Not part of the app.
         Serve the repo root over HTTP and open /docs/design/route/map-shell.html.
         Query (route-contract-2.md M.1): ?s=closed (default) shows the drawer handle only; ?drawer=open (or
         ?s=open, for scripts/screenshot_design.py --screen open) opens the route drawer; ?s=hidden hides the
         drawer entirely (full-map view); ?s=landmark opens a landmark card; ?lm=all (or ?s=all) shows every landmark, ?lm=route
         (default) only this route's; ?theme=dark|light forces a theme. Only the selected route is drawn.
         Emoji are numeric entities or \u escapes so the file stays ASCII. -->
    <link rel="icon" href="../../../static/icon.svg">
    <link rel="stylesheet" href="../../../static/style.css">
    <link rel="stylesheet" href="../../../static/theme-painterly.css">
    <link rel="stylesheet" href="map-shell.css">
    <link rel="stylesheet" href="map-drawer.css">
  </head>
  <body class="map-shell">
    <h1 class="vh">MemriPal routes</h1>
    <main class="shell">
      <div class="map-wrap">
        <svg id="map" class="map" viewBox="30 50 720 780" preserveAspectRatio="xMidYMid meet"
             role="group" aria-labelledby="map-title">
          <title id="map-title">Map with 3 routes; Morning walk to the station is framed</title>
          <defs>
            <!-- Reveal mask: a solid stroke drawn in over the path, so a dashed route draws in too. -->
            <mask id="reveal" maskUnits="userSpaceOnUse" x="-1500" y="-1500" width="4000" height="4000">
              <polyline id="reveal-line" class="reveal" points="0,0"></polyline>
            </mask>
          </defs>
          <rect class="map-land" x="-1500" y="-1500" width="4000" height="4000"></rect>
          <path class="map-river" d="M-1500 200 C0 140 300 240 600 180 S1100 150 2500 210"></path>
          <path class="map-street-casing" d="M-1500 -1180H2500M-1500 -1020H2500M-1500 -860H2500M-1500 -700H2500M-1500 -540H2500M-1500 -380H2500M-1500 -220H2500M-1500 -60H2500M-1500 100H2500M-1500 260H2500M-1500 420H2500M-1500 580H2500M-1500 740H2500M-1500 900H2500M-1500 1060H2500M-1500 1220H2500M-1500 1380H2500M-1500 1540H2500M-1500 1700H2500M-1500 1860H2500M-1500 2020H2500M-1500 2180H2500M-1500 2340H2500M-1320 -1500V2500M-1140 -1500V2500M-960 -1500V2500M-780 -1500V2500M-600 -1500V2500M-420 -1500V2500M-240 -1500V2500M-60 -1500V2500M120 -1500V2500M300 -1500V2500M480 -1500V2500M660 -1500V2500M840 -1500V2500M1020 -1500V2500M1200 -1500V2500M1380 -1500V2500M1560 -1500V2500M1740 -1500V2500M1920 -1500V2500M2100 -1500V2500M2280 -1500V2500"></path>
          <path class="map-street" d="M-1500 -1180H2500M-1500 -1020H2500M-1500 -860H2500M-1500 -700H2500M-1500 -540H2500M-1500 -380H2500M-1500 -220H2500M-1500 -60H2500M-1500 100H2500M-1500 260H2500M-1500 420H2500M-1500 580H2500M-1500 740H2500M-1500 900H2500M-1500 1060H2500M-1500 1220H2500M-1500 1380H2500M-1500 1540H2500M-1500 1700H2500M-1500 1860H2500M-1500 2020H2500M-1500 2180H2500M-1500 2340H2500M-1320 -1500V2500M-1140 -1500V2500M-960 -1500V2500M-780 -1500V2500M-600 -1500V2500M-420 -1500V2500M-240 -1500V2500M-60 -1500V2500M120 -1500V2500M300 -1500V2500M480 -1500V2500M660 -1500V2500M840 -1500V2500M1020 -1500V2500M1200 -1500V2500M1380 -1500V2500M1560 -1500V2500M1740 -1500V2500M1920 -1500V2500M2100 -1500V2500M2280 -1500V2500"></path>
          <rect class="map-park" x="560" y="520" width="260" height="240" rx="28"></rect>
          <ellipse class="map-water" cx="690" cy="640" rx="44" ry="30"></ellipse>
          <text class="map-label" x="380" y="196">Ash River</text>
          <text class="map-label" x="150" y="412">Station Road</text>
          <text class="map-label" x="690" y="752">Elm Park</text>

          <!-- Off-route landmarks (filter "All landmarks"): only those near the viewBox exist in the DOM. -->
          <g id="offroute"></g>
          <!-- The one drawn route: path plus numbered landmarks, rebuilt on every pick. -->
          <g id="route" class="route"></g>
        </svg>
        <!-- Reserved slot: map tiles (if adopted) require this credit in the map corner. -->
        <p class="map-attrib">&#xA9; OpenStreetMap contributors</p>
      </div>

      <div class="map-top">
        <p id="chip" class="map-chip" aria-live="polite">
          <span id="chip-name" class="map-chip-name">Morning walk to the station</span>
          <span class="chip-topic"><span class="topic-dot" aria-hidden="true"></span><span id="chip-topic"></span></span>
          <span id="chip-meta" class="map-chip-meta">Daily, 6 stations</span>
        </p>
      </div>

      <fieldset class="lm-filter">
        <legend class="vh">Landmarks shown</legend>
        <input id="lm-route" type="radio" name="lm" value="route" checked><label for="lm-route">This route</label>
        <input id="lm-all" type="radio" name="lm" value="all"><label for="lm-all">All landmarks</label>
      </fieldset>

      <div id="lm-card" class="lm-card" role="dialog" aria-labelledby="lm-card-title" hidden>
        <span id="lm-card-emoji" class="lm-card-emoji" aria-hidden="true"></span>
        <div class="lm-card-text">
          <h2 id="lm-card-title" class="lm-card-title"></h2>
          <p id="lm-card-meta" class="lm-card-meta"></p>
        </div>
        <button id="lm-card-close" class="lm-card-close" type="button" aria-label="Close landmark card">&#xD7;</button>
      </div>

      <details id="drawer" class="drawer">
        <summary class="drawer-handle">
          <span class="when-closed">Route settings</span><span class="when-open">Close</span>
        </summary>
        <div class="drawer-body">
          <section class="drawer-section" aria-labelledby="current-title">
            <!-- Compact by default (summary row) so search and the route list stay above the fold on a phone. -->
            <div class="route-head">
              <h2 id="current-title" class="drawer-title">This route</h2>
              <button id="route-edit" class="btn route-edit" type="button" aria-expanded="false"
                      aria-controls="route-fields">Edit route</button>
            </div>
            <p id="route-sum" class="route-sum">
              <span id="route-sum-name" class="route-sum-name">Morning walk to the station</span>
              <span class="chip-topic"><span class="topic-dot" aria-hidden="true"></span><span id="route-sum-meta"></span></span>
            </p>
            <div id="route-fields" class="route-fields" hidden>
            <div class="field">
              <label for="route-name">Name</label>
              <input id="route-name" type="text" maxlength="40" autocomplete="off" value="Morning walk to the station">
            </div>
            <div class="field">
              <label for="route-often">How often you walk it</label>
              <select id="route-often">
                <option>Daily</option>
                <option>Weekly</option>
                <option>Occasional</option>
              </select>
            </div>
            <div class="field">
              <label for="route-topic">Topic (list on this route)</label>
              <!-- Typeahead over every topic; the datalist lists recently used topics first. -->
              <input id="route-topic" type="text" list="topic-options" autocomplete="off" spellcheck="false"
                     aria-describedby="topic-hint">
              <datalist id="topic-options"></datalist>
              <p id="topic-hint" class="field-hint">Type to search; recent topics first.</p>
            </div>
            <p class="drawer-count">Stations: <strong id="route-count">6</strong></p>
            </div>
          </section>

          <button id="map-new" class="btn btn-primary" type="button">Map a new route</button>

          <section class="drawer-section is-picks" aria-labelledby="existing-title">
            <h2 id="existing-title" class="drawer-title">Existing routes</h2>
            <div class="field">
              <label for="route-search">Search routes</label>
              <input id="route-search" type="text" role="searchbox" autocomplete="off" placeholder="Name or topic"
                     aria-controls="pick-viewport" aria-describedby="pick-count">
            </div>
            <p id="pick-count" class="field-hint" aria-live="polite"></p>
            <!-- Windowed list: only rows in view (plus overscan) exist; fixed row and header heights. -->
            <div id="pick-viewport" class="pick-viewport" role="list" aria-labelledby="existing-title" tabindex="-1">
              <div id="pick-space" class="pick-space"></div>
            </div>
          </section>
        </div>
      </details>
    </main>

    <nav class="tabbar" aria-label="Main">
      <ul>
        <li><a class="tab" href="#routes" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c3-6 11-2 14-12"></path><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="7" r="2"></circle></svg>
          Routes</a></li>
        <li><a class="tab" href="#recall">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 10.5l2 2 4-4"></path></svg>
          Recall</a></li>
        <li><a class="tab" href="#landmarks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-6.5-6-11a6 6 0 0 1 12 0c0 4.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg>
          Landmarks</a></li>
        <li><a class="tab" href="#settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
          Settings</a></li>
      </ul>
    </nav>

    <script>
      // Preview behaviour: one drawn route, landmark cards, and a virtualized off-route landmark layer.
      (function () {
        "use strict";
        var q = new URLSearchParams(location.search);
        var root = document.documentElement;
        var theme = q.get("theme");
        if (theme === "dark" || theme === "light") root.setAttribute("data-theme", theme);
        var s = q.get("s");
        var drawer = document.getElementById("drawer");
        if (q.get("drawer") === "open" || s === "open") drawer.open = true;
        drawer.hidden = s === "hidden";

        var NS = "http://www.w3.org/2000/svg";
        var map = document.getElementById("map");
        var routeG = document.getElementById("route");
        var offG = document.getElementById("offroute");
        var revealLine = document.getElementById("reveal-line");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // ---------- DATA: 6 hand routes, seeded padding to 1000, 125 topics ----------
        function djb2(str) {
          var h = 5381;
          for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
          return h;
        }
        function mulberry32(a) {
          return function () {
            a = (a + 0x6D2B79F5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var SUBJ = ["Biology", "Chemistry", "Spanish", "French", "History", "Physics", "Poetry", "Guitar chords",
          "Chess openings", "Anatomy", "Contract law", "Music theory", "Geography", "Kanji", "Statistics",
          "Art history", "Economics", "Philosophy", "Astronomy", "Recipes", "Bird calls", "Wedding", "Python",
          "Botany", "Wine regions"];
        var KIND = ["basics", "exam", "vocabulary", "review", "toast"];
        var TOPICS = [];
        SUBJ.forEach(function (a) { KIND.forEach(function (b) { TOPICS.push(a + " " + b); }); });
        TOPICS[1] = "Biology exam, chapter 3";
        function tc(topic) { return "tc-" + (djb2(topic) % 8); }

        // Station: [x, y, name, emoji code point]. Points: path corners on the street grid.
        var HAND = [
          { id: "morning", name: "Morning walk to the station", often: "Daily", topic: TOPICS[1],
            points: [[120, 740], [300, 740], [300, 580], [480, 580], [480, 420], [660, 420], [660, 260]],
            stations: [[120, 740, "Front door", 0x1F6AA], [300, 740, "Bakery", 0x1F950], [300, 580, "Bus stop", 0x1F68F],
              [480, 500, "Old oak", 0x1F333], [660, 420, "Fountain", 0x26F2], [660, 260, "Station clock", 0x23F0]] },
          { id: "grandma", name: "Grandma's house", often: "Occasional", topic: "Wedding toast",
            points: [[300, 900], [840, 900], [840, 260]],
            stations: [[300, 900, "Garden gate", 0x1F33B], [480, 900, "Post box", 0x1F4EE], [660, 900, "Cafe", 0x2615],
              [840, 900, "Church", 0x26EA], [840, 740, "Pond", 0x1F986], [840, 580, "Tennis court", 0x1F3BE],
              [840, 420, "Library", 0x1F4DA], [840, 260, "Grandma's door", 0x1F475]] },
          { id: "park", name: "Park loop", often: "Daily", topic: "Bird calls review",
            points: [[600, 560], [780, 560], [780, 720], [600, 720], [600, 560]],
            stations: [[600, 560, "Park gate", 0x1F6AA], [780, 640, "Bandstand", 0x1F3B5], [640, 720, "Duck pond", 0x1F986]] },
          { id: "riverside", name: "Riverside run", often: "Weekly", topic: "Spanish vocabulary",
            points: [[-1140, 260], [-420, 260], [-420, 100]],
            stations: [[-1140, 260, "Boathouse", 0x1F6A3], [-780, 260, "Pier", 0x2693], [-420, 260, "Footbridge", 0x1F309],
              [-420, 100, "Mill", 0x1F3ED]] },
          { id: "market", name: "Saturday market", often: "Weekly", topic: "Recipes basics",
            points: [[1020, 580], [1560, 580], [1560, 900]],
            stations: [[1020, 580, "Fruit stall", 0x1F34E], [1200, 580, "Cheese cart", 0x1F9C0], [1380, 580, "Flower stand", 0x1F337],
              [1560, 580, "Fish market", 0x1F41F], [1560, 900, "Clock tower", 0x1F55B]] },
          { id: "hill", name: "Hill climb", often: "Occasional", topic: "Astronomy review",
            points: [[300, 1380], [300, 1860], [840, 1860]],
            stations: [[300, 1380, "Trailhead", 0x1F97E], [300, 1700, "Lookout", 0x1F52D], [480, 1860, "Stone wall", 0x1FAA8],
              [840, 1860, "Summit cairn", 0x26F0]] }
        ];
        var PLACES = [["Corner shop", 0x1F3EA], ["Bench", 0x1FA91], ["Bridge", 0x1F309], ["Mailbox", 0x1F4EB],
          ["Bike rack", 0x1F6B2], ["Mural", 0x1F3A8], ["Bus shelter", 0x1F68F], ["Statue", 0x1F5FF],
          ["School", 0x1F3EB], ["Pharmacy", 0x1F48A], ["Pizza place", 0x1F355], ["Gym", 0x1F3CB]];
        var WHEN = ["Evening", "Lunch", "Sunday", "Errand", "Dog", "Gym", "School", "Office"];
        var WALK = ["loop", "run", "walk", "route", "stroll"];
        var OFTEN = ["Daily", "Weekly", "Occasional"];
        var X0 = -1320, DX = 180, NX = 21, Y0 = -1180, DY = 160, NY = 22;
        var ROUTES = HAND.slice();
        var rnd = mulberry32(72);
        function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
        for (var n = ROUTES.length; n < 1000; n++) {
          var gx = Math.floor(rnd() * NX), gy = Math.floor(rnd() * NY);
          var pts = [[X0 + gx * DX, Y0 + gy * DY]], legs = 2 + Math.floor(rnd() * 4);
          for (var l = 0; l < legs; l++) {
            var step = (1 + Math.floor(rnd() * 3)) * (rnd() < 0.5 ? -1 : 1);
            if (l % 2) gy = Math.min(NY - 1, Math.max(0, gy + step)); else gx = Math.min(NX - 1, Math.max(0, gx + step));
            pts.push([X0 + gx * DX, Y0 + gy * DY]);
          }
          ROUTES.push({ id: "r" + n, name: pick(WHEN) + " " + pick(WALK) + " " + n, often: pick(OFTEN),
            topic: TOPICS[Math.floor(rnd() * TOPICS.length)], points: pts,
            stations: pts.map(function (p) { var pl = pick(PLACES); return [p[0], p[1], pl[0], pl[1]]; }) });
        }
        var BY_ID = {};
        ROUTES.forEach(function (r) { BY_ID[r.id] = r; r.tc = tc(r.topic); });
        // Off-route pool: other routes' stations, deduped by position, kept sparse so "All landmarks" reads
        // as a few real places, not a pin on every corner. Hand routes keep every station; padded routes
        // contribute their start station only, at most one per 3x3-block cell.
        var POOL = [], seen = {}, cells = {};
        function addOff(st, r) {
          var key = st[0] + "," + st[1];
          if (seen[key]) return;
          seen[key] = 1;
          cells[Math.floor((st[0] - X0) / (3 * DX)) + "," + Math.floor((st[1] - Y0) / (3 * DY))] = 1;
          POOL.push({ key: key, st: st, route: r });
        }
        HAND.forEach(function (r) { r.stations.forEach(function (st) { addOff(st, r); }); });
        ROUTES.slice(HAND.length).forEach(function (r) {
          var st = r.stations[0];
          var cell = Math.floor((st[0] - X0) / (3 * DX)) + "," + Math.floor((st[1] - Y0) / (3 * DY));
          if (!cells[cell]) addOff(st, r);
        });

        // ---------- MAP ----------
        // Frame padding in map units; extra top room clears the chip, right the drawer handle (none when the
        // drawer is hidden), bottom the filter.
        var PAD = 70, TOP = 130, RIGHT = drawer.hidden ? 0 : 90, BOTTOM = 70, MIN = 420, PAN_MS = 800;
        var current = null, anim = 0, popTimer = 0, offNodes = {};
        function svg(tag, attrs, parent) {
          var el = document.createElementNS(NS, tag);
          Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
          if (parent) parent.appendChild(el);
          return el;
        }
        function vbox() { var b = map.viewBox.baseVal; return [b.x, b.y, b.width, b.height]; }
        // --k = map units per CSS px under "meet", so CSS sizes stay constant on screen at any zoom.
        function setBox(v) {
          map.setAttribute("viewBox", v.map(function (x) { return x.toFixed(1); }).join(" "));
          var k = Math.max(v[2] / (map.clientWidth || 1), v[3] / (map.clientHeight || 1));
          map.style.setProperty("--k", k.toFixed(4));
        }
        function frameOf(r) {
          var xs = [], ys = [];
          r.points.concat(r.stations).forEach(function (p) { xs.push(p[0]); ys.push(p[1]); });
          var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
          var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
          var w = Math.max(x1 - x0, MIN), h = Math.max(y1 - y0, MIN), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
          return [cx - w / 2 - PAD, cy - h / 2 - PAD - TOP, w + 2 * PAD + RIGHT, h + 2 * PAD + TOP + BOTTOM];
        }
        function tween(dur, frame, done) {
          window.cancelAnimationFrame(anim);
          var t0 = performance.now();
          function step(now) {
            var t = Math.min(1, (now - t0) / dur);
            frame(1 - Math.pow(1 - t, 3));
            if (t < 1) anim = window.requestAnimationFrame(step); else done();
          }
          anim = window.requestAnimationFrame(step);
        }
        function landmark(parent, st, i, r, off) {
          var g = svg("g", { "class": off ? "lm lm-off" : "lm", tabindex: "0", role: "button",
            transform: "translate(" + st[0] + " " + st[1] + ")",
            "aria-label": off ? st[2] + ", on " + r.name : (i + 1) + ". " + st[2] }, parent);
          g.style.setProperty("--i", i);
          g.lmData = { st: st, i: i, route: r, off: off };
          svg("circle", { "class": "lm-hit" }, g);
          var mark = svg("g", { "class": "lm-mark" }, g);
          svg("circle", { "class": "lm-dot" }, mark);
          if (!off) {
            svg("text", { "class": "lm-num" }, mark).textContent = i + 1;
            svg("text", { "class": "lm-emoji", "aria-hidden": "true" }, g).textContent = String.fromCodePoint(st[3]);
          }
          return g;
        }
        function drawRoute(r) {
          routeG.textContent = "";
          routeG.setAttribute("class", "route " + r.tc);
          var pts = r.points.join(" ");
          var lines = svg("g", { mask: "url(#reveal)" }, routeG);
          svg("polyline", { "class": "route-halo", points: pts }, lines);
          svg("polyline", { "class": "route-line", points: pts }, lines);
          revealLine.setAttribute("points", pts);
          revealLine.style.strokeDasharray = "";
          revealLine.style.strokeDashoffset = "";
          r.stations.forEach(function (st, i) { landmark(routeG, st, i, r, false); });
        }
        // Virtualized: only off-route landmarks inside the viewBox plus a 25% margin exist in the DOM.
        function cull() {
          var all = document.getElementById("lm-all").checked;
          offG.hidden = !all;
          var v = vbox(), mx = v[2] * 0.25, my = v[3] * 0.25, mine = {}, want = {};
          current.stations.forEach(function (st) { mine[st[0] + "," + st[1]] = 1; });
          if (all) POOL.forEach(function (o) {
            var x = o.st[0], y = o.st[1];
            if (o.route !== current && !mine[o.key] && x >= v[0] - mx && x <= v[0] + v[2] + mx &&
                y >= v[1] - my && y <= v[1] + v[3] + my) want[o.key] = o;
          });
          Object.keys(offNodes).forEach(function (key) {
            if (want[key] || offNodes[key] === document.activeElement) return;
            offNodes[key].remove();
            delete offNodes[key];
          });
          Object.keys(want).forEach(function (key) {
            if (!offNodes[key]) offNodes[key] = landmark(offG, want[key].st, 0, want[key].route, true);
          });
        }
        function syncChrome(r) {
          document.getElementById("chip").setAttribute("class", "map-chip " + r.tc);
          document.getElementById("chip-name").textContent = r.name;
          document.getElementById("chip-topic").textContent = r.topic;
          document.getElementById("chip-meta").textContent = r.often + ", " + r.stations.length + " stations";
          document.getElementById("map-title").textContent = "Map; " + r.name + " is drawn";
          document.getElementById("route-name").value = r.name;
          document.getElementById("route-often").value = r.often;
          document.getElementById("route-count").textContent = r.stations.length;
          document.getElementById("route-sum").setAttribute("class", "route-sum " + r.tc);
          document.getElementById("route-sum-name").textContent = r.name;
          document.getElementById("route-sum-meta").textContent = r.often + ", " + r.stations.length + " stations, " + r.topic;
          topicIn.value = r.topic;
          topicIn.removeAttribute("aria-invalid");
        }
        // Pick: pan to frame, then the line draws in through the mask, then landmarks pop in order.
        function select(r, animate) {
          current = r;
          touch(recentRoutes, r, 5);
          touch(recentTopics, r.topic, 8);
          closeCard(false);
          window.clearTimeout(popTimer);
          drawRoute(r);
          syncChrome(r);
          var target = frameOf(r);
          if (!animate || reduce) { setBox(target); cull(); return; }
          var len = revealLine.getTotalLength(), from = vbox();
          revealLine.style.strokeDasharray = len + " " + len;
          revealLine.style.strokeDashoffset = len;
          routeG.classList.add("is-arriving");
          tween(PAN_MS, function (e) { setBox(from.map(function (f, i) { return f + (target[i] - f) * e; })); }, function () {
            cull();
            tween(Math.min(1200, 300 + len * 0.6), function (e) { revealLine.style.strokeDashoffset = len * (1 - e); }, function () {
              revealLine.style.strokeDasharray = "";
              revealLine.style.strokeDashoffset = "";
              routeG.classList.replace("is-arriving", "is-popping");
              popTimer = window.setTimeout(function () { routeG.classList.remove("is-popping"); }, r.stations.length * 110 + 600);
            });
          });
        }

        // ---------- LANDMARK CARD ----------
        var card = document.getElementById("lm-card"), cardFor = null;
        function openCard(g) {
          var d = g.lmData;
          cardFor = g;
          document.getElementById("lm-card-emoji").textContent = String.fromCodePoint(d.st[3]);
          document.getElementById("lm-card-title").textContent = d.st[2];
          document.getElementById("lm-card-meta").textContent = d.off
            ? "On " + d.route.name + ", topic " + d.route.topic
            : "Station " + (d.i + 1) + " of " + d.route.stations.length + ", " + d.route.topic;
          card.hidden = false;
          var b = g.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight;
          var top = b.bottom + 8 + ch > window.innerHeight - 72 ? b.top - ch - 8 : b.bottom + 8;
          card.style.left = Math.min(window.innerWidth - cw - 8, Math.max(8, b.left + b.width / 2 - cw / 2)) + "px";
          card.style.top = Math.max(8, top) + "px";
        }
        function closeCard(refocus) {
          if (card.hidden) return;
          card.hidden = true;
          if (refocus && cardFor && cardFor.isConnected) cardFor.focus();
          cardFor = null;
        }

        document.getElementById("lm-card-close").addEventListener("click", function () { closeCard(true); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(true); });
        map.addEventListener("click", function (e) {
          var g = e.target.closest(".lm");
          if (g) openCard(g);
        });
        map.addEventListener("keydown", function (e) {
          var g = e.target.closest(".lm");
          if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCard(g); }
        });

        // ---------- PAN / ZOOM (off-route layer recomputes when each gesture ends) ----------
        var drag = null, holdTimer = 0, wheelTimer = 0;
        map.addEventListener("pointerdown", function (e) {
          var g = e.target.closest(".lm");
          if (g) { holdTimer = window.setTimeout(function () { openCard(g); }, 500); return; }
          drag = { x: e.clientX, y: e.clientY, v: vbox() };
          map.setPointerCapture(e.pointerId);
        });
        map.addEventListener("pointermove", function (e) {
          if (!drag) return;
          var k = parseFloat(map.style.getPropertyValue("--k")) || 1;
          setBox([drag.v[0] - (e.clientX - drag.x) * k, drag.v[1] - (e.clientY - drag.y) * k, drag.v[2], drag.v[3]]);
        });
        function endPointer() {
          window.clearTimeout(holdTimer);
          if (drag) { drag = null; cull(); }
        }
        map.addEventListener("pointerup", endPointer);
        map.addEventListener("pointercancel", endPointer);
        map.addEventListener("wheel", function (e) {
          e.preventDefault();
          var v = vbox(), rect = map.getBoundingClientRect();
          var k = Math.max(v[2] / rect.width, v[3] / rect.height);
          // Zoom about the pointer: "meet" centres the viewBox, so map point = centre + screen offset * k.
          var px = v[0] + v[2] / 2 + (e.clientX - rect.left - rect.width / 2) * k;
          var py = v[1] + v[3] / 2 + (e.clientY - rect.top - rect.height / 2) * k;
          var f = Math.min(4000, Math.max(200, v[2] * (e.deltaY > 0 ? 1.15 : 1 / 1.15))) / v[2];
          setBox([px - (px - v[0]) * f, py - (py - v[1]) * f, v[2] * f, v[3] * f]);
          window.clearTimeout(wheelTimer);
          wheelTimer = window.setTimeout(cull, 150);
        }, { passive: false });
        window.addEventListener("resize", function () { setBox(vbox()); });
        Array.prototype.forEach.call(document.querySelectorAll(".lm-filter input"), function (inp) {
          inp.addEventListener("change", cull);
        });

        // ---------- DRAWER: topic typeahead ----------
        // Most-recent-first lists; touch() moves an item to the front and caps the length.
        var recentRoutes = HAND.slice(0, 3).reverse(), recentTopics = [];
        function touch(list, item, cap) {
          var i = list.indexOf(item);
          if (i >= 0) list.splice(i, 1);
          list.unshift(item);
          list.length = Math.min(list.length, cap);
        }
        var topicIn = document.getElementById("route-topic");
        var topicOpts = document.getElementById("topic-options");
        var TOPIC_BY_LC = {};
        TOPICS.forEach(function (t) { TOPIC_BY_LC[t.toLowerCase()] = t; });
        var SORTED_TOPICS = TOPICS.slice().sort();
        function fillTopics() {
          topicOpts.textContent = "";
          recentTopics.concat(SORTED_TOPICS.filter(function (t) { return recentTopics.indexOf(t) < 0; }))
            .forEach(function (t) { topicOpts.appendChild(new Option(t)); });
        }
        topicIn.addEventListener("change", function () {
          var t = TOPIC_BY_LC[topicIn.value.trim().toLowerCase()];
          if (!t) { topicIn.setAttribute("aria-invalid", "true"); return; }
          current.topic = t;
          current.tc = tc(t);
          touch(recentTopics, t, 8);
          routeG.setAttribute("class", routeG.getAttribute("class").replace(/tc-\d/, current.tc));
          syncChrome(current);
          fillTopics();
          buildRows();
        });

        var editBtn = document.getElementById("route-edit"), fields = document.getElementById("route-fields");
        editBtn.addEventListener("click", function () {
          var open = editBtn.getAttribute("aria-expanded") !== "true";
          editBtn.setAttribute("aria-expanded", String(open));
          fields.hidden = !open;
        });
        // Live: the chip, summary row and list row follow the select without a save step.
        document.getElementById("route-often").addEventListener("change", function (e) {
          current.often = e.target.value;
          syncChrome(current);
          buildRows();
        });

        // ---------- DRAWER: windowed route list ----------
        // Fixed heights (px) let a binary search over prefix offsets find the first visible item.
        var ROW_H = 64, HEAD_H = 36, OVERSCAN = 4;
        var vp = document.getElementById("pick-viewport"), space = document.getElementById("pick-space");
        var searchIn = document.getElementById("route-search");
        var items = [], tops = [], rowIdx = [], rowNodes = {}, active = 0;
        function buildRows() {
          var qy = searchIn.value.trim().toLowerCase();
          var hit = function (r) { return !qy || (r.name + " " + r.topic).toLowerCase().indexOf(qy) >= 0; };
          var recent = recentRoutes.filter(hit), groups = {};
          ROUTES.forEach(function (r) {
            if (recent.indexOf(r) < 0 && hit(r)) (groups[r.topic] = groups[r.topic] || []).push(r);
          });
          items = [];
          if (recent.length) items.push({ head: "Recent" });
          recent.forEach(function (r) { items.push({ route: r }); });
          Object.keys(groups).sort().forEach(function (t) {
            items.push({ head: t + " (" + groups[t].length + ")" });
            groups[t].sort(function (a, b) { return a.name < b.name ? -1 : 1; })
              .forEach(function (r) { items.push({ route: r }); });
          });
          tops = []; rowIdx = [];
          var y = 0;
          items.forEach(function (it, i) {
            tops.push(y);
            y += it.head ? HEAD_H : ROW_H;
            if (it.route) { it.pos = rowIdx.length + 1; rowIdx.push(i); }
          });
          space.style.height = y + "px";
          document.getElementById("pick-count").textContent = rowIdx.length
            ? rowIdx.length + " routes" : 'No routes match "' + searchIn.value.trim() + '"';
          active = Math.max(0, rowIdx.indexOf(items.findIndex(function (it) { return it.route === current; })));
          Object.keys(rowNodes).forEach(function (k) { rowNodes[k].remove(); });
          rowNodes = {};
          renderRows();
        }
        function firstAt(y) {
          var lo = 0, hi = tops.length - 1;
          while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (tops[mid] <= y) lo = mid; else hi = mid - 1; }
          return lo;
        }
        function rowNode(i) {
          var it = items[i], el = document.createElement("div");
          el.className = it.head ? "pick-head" : "pick-row";
          el.style.top = tops[i] + "px";
          if (it.head) { el.setAttribute("aria-hidden", "true"); el.textContent = it.head; return el; }
          var r = it.route;
          el.setAttribute("role", "listitem");
          el.setAttribute("aria-setsize", rowIdx.length);
          el.setAttribute("aria-posinset", it.pos);
          var b = document.createElement("button");
          b.type = "button";
          b.className = "route-pick " + r.tc;
          b.dataset.item = i;
          if (r === current) b.setAttribute("aria-current", "true");
          b.innerHTML = '<span class="pick-swatch" aria-hidden="true"></span><span class="pick-name"></span>' +
            '<span class="pick-meta"></span>';
          b.children[1].textContent = r.name;
          b.children[2].textContent = r.often + ", " + r.stations.length + " stations, " + r.topic;
          el.appendChild(b);
          return el;
        }
        function renderRows() {
          if (!items.length) return;
          var a = Math.max(0, firstAt(vp.scrollTop) - OVERSCAN);
          var z = Math.min(items.length - 1, firstAt(vp.scrollTop + (vp.clientHeight || 400)) + OVERSCAN);
          var keep = {}, focused = document.activeElement;
          for (var i = a; i <= z; i++) keep[i] = 1;
          if (rowIdx.length) keep[rowIdx[active]] = 1;
          Object.keys(rowNodes).forEach(function (k) {
            if (!keep[k] && !rowNodes[k].contains(focused)) { rowNodes[k].remove(); delete rowNodes[k]; }
          });
          Object.keys(keep).forEach(function (k) {
            if (!rowNodes[k]) rowNodes[k] = space.appendChild(rowNode(+k));
            var btn = rowNodes[k].querySelector("button");
            if (btn) btn.tabIndex = +k === rowIdx[active] ? 0 : -1;
          });
        }
        // Roving focus: arrows/Home/End/PageUp/PageDown move between rows, scrolling the target into the window.
        function focusRow(n) {
          if (!rowIdx.length) return;
          active = Math.max(0, Math.min(rowIdx.length - 1, n));
          var i = rowIdx[active], top = tops[i], h = vp.clientHeight;
          if (top < vp.scrollTop + HEAD_H) vp.scrollTop = Math.max(0, top - HEAD_H);
          else if (top + ROW_H > vp.scrollTop + h) vp.scrollTop = top + ROW_H - h;
          renderRows();
          rowNodes[i].querySelector("button").focus();
        }
        var scrollFrame = 0;
        vp.addEventListener("scroll", function () {
          window.cancelAnimationFrame(scrollFrame);
          scrollFrame = window.requestAnimationFrame(renderRows);
        });
        vp.addEventListener("click", function (e) {
          var b = e.target.closest(".route-pick");
          if (!b) return;
          select(items[+b.dataset.item].route, true);
          buildRows();
          focusRow(active);
        });
        vp.addEventListener("keydown", function (e) {
          var page = Math.max(1, Math.floor(vp.clientHeight / ROW_H) - 1);
          var to = { ArrowDown: active + 1, ArrowUp: active - 1, Home: 0, End: rowIdx.length - 1,
            PageDown: active + page, PageUp: active - page }[e.key];
          if (to === undefined || !e.target.closest(".route-pick")) return;
          e.preventDefault();
          focusRow(to);
        });
        searchIn.addEventListener("input", function () { vp.scrollTop = 0; buildRows(); });
        searchIn.addEventListener("keydown", function (e) {
          if (e.key === "ArrowDown") { e.preventDefault(); focusRow(0); }
        });
        document.getElementById("drawer").addEventListener("toggle", renderRows);
        if ((q.get("lm") || (s === "all" ? "all" : "route")) === "all") document.getElementById("lm-all").checked = true;
        select(BY_ID.morning, false);
        fillTopics();
        buildRows();
        if (s === "landmark") openCard(routeG.querySelectorAll(".lm")[1]);
      })();
    </script>
  </body>
</html>
