<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street credit preview</title>
<!-- MEM-098 (ADR 0058) design preview: renderCredit under a .scene-frame image. ?theme=light|dark forces a theme.
     The base makes the module's relative logo paths (img/...) resolve the way they do in the app. -->
<base href="/static/">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1.5rem; }
  .card { background: var(--surface); border-radius: 12px; padding: 1rem; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 0.5rem; font: 600 1rem/1.3 var(--body); color: var(--ink); }
  .scene-frame .stand-in { aspect-ratio: 4 / 3; width: 100%;
    background: linear-gradient(180deg, #9cb8d6 0 45%, #6d7a86 45% 60%, #3e454c 60%); }
</style>
</head>
<body>
<main id="cards"></main>
<script type="module">
  import { renderCredit } from "./street_photo.js";

  const forced = new URLSearchParams(location.search).get("theme");
  if (forced === "light" || forced === "dark") document.documentElement.dataset.theme = forced;
  // Resolved theme: an explicit data-theme wins, otherwise the OS preference (what the app's caller must pass).
  const theme = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

  const samples = [
    { title: "Mailbox at the corner", author: "kendall_walker" },
    { title: "Long contributor name wraps", author: "a_contributor_with_a_really_long_mapillary_username_2026" },
  ];
  const cards = document.getElementById("cards");
  for (const s of samples) {
    const card = document.createElement("section");
    card.className = "card";
    const h = document.createElement("h2");
    h.textContent = s.title;
    const frame = document.createElement("div");
    frame.className = "scene-frame";
    const img = document.createElement("div");
    img.className = "stand-in";
    frame.append(img);
    const credit = renderCredit(document, {
      author: s.author,
      image_url: "https://www.mapillary.com/app/?pKey=1234567890",
      licence: "CC BY-SA 4.0",
    }, { theme });
    card.append(h, frame, credit);
    cards.append(card);
  }
</script>
</body>
</html>
